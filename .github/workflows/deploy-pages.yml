name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # URL pública da API (Render/Fly/Railway/VPS/etc.), definida em
          # Settings > Secrets and variables > Actions > Variables > API_URL.
          # Sem essa variável, o build sai com caminho relativo /api, que só
          # funciona se algo mais servir a API na mesma origem do Pages —
          # ou seja, sem backend hospedado à parte, login fica indisponível
          # no site publicado, mas o resto do app carrega normalmente.
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
